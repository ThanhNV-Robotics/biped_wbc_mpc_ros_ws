# Real-time simulation configuration
real_time_control:
  ros__parameters:
    # Simulation timing
    simulation_rate: 1000.0      # Hz - matches controller update rate / match mujoco simulation rate 
    rendering_rate: 60.0        # Hz - standard monitor refresh rate
    camera_rate: 6.0           # Hz - camera publishing rate
    
    # Real-time synchronization
    enable_real_time: true     # Enable real-time synchronization
    enable_vsync: true         # Enable vertical sync for rendering
    
    # Timing tolerances
    max_simulation_lag: 0.001   # Maximum allowed simulation lag (seconds)
    max_rendering_lag: 0.016    # Maximum allowed rendering lag (seconds)
    
    # Performance monitoring
    enable_timing_logs: true    # Log timing information
    log_interval: 5.0          # Log timing every N seconds
