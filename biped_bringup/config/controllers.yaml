controller_manager:
  ros__parameters:
    update_rate: 500  # Hz, one UDP command + one state per cycle (CM4 CAN loop: 500 Hz too)

    # Start with the motors disabled. Enable on purpose:
    #   ros2 control set_hardware_component_state BipedSystem active
    hardware_components_initial_state:
      inactive: [BipedSystem]

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Slider jogging (started by slider:=true): position from joint_state_publisher_gui, rate-limited
    # and filtered, velocity = 0, effort = 0. The motors use their own kp / kd (PVT only).
    joint_jogging_controller:
      type: biped_controllers/JointJoggingController

    wbc_controller:
      type: biped_controllers/WBCController #package/class

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu
    frame_id: link0_torso

joint_state_broadcaster:
  ros__parameters:
    # Selects what is published. In Humble it does NOT fix the order of /joint_states (tested:
    # the right leg still comes out mixed), so always match values by name.
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_pitch_joint
      - left_ankle_roll_joint
      - left_ankle_pitch_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_pitch_joint
      - right_ankle_roll_joint
      - right_ankle_pitch_joint
    interfaces: [position, velocity, effort]

joint_jogging_controller:
  ros__parameters:
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_pitch_joint
      - left_ankle_roll_joint
      - left_ankle_pitch_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_pitch_joint
      - right_ankle_roll_joint
      - right_ankle_pitch_joint
    slider_topic: /slider_joint_states
    max_velocity: 0.3          # rad/s, how fast a joint moves toward its slider
    filter_time_constant: 0.1  # s, low-pass after the rate limit

wbc_controller:
  ros__parameters:
    urdf_package: biped_description
    urdf_file: urdf/v2_biped_robot_12dof.urdf   # relative to the package share directory
    # Controlled joints (ros2_control names). Matched by name everywhere, the order is free.
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_pitch_joint
      - left_ankle_roll_joint
      - left_ankle_pitch_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_pitch_joint
      - right_ankle_roll_joint
      - right_ankle_pitch_joint
    # Defaults in ControllerParams (controller_params.hpp); uncomment to change
    # config_package: biped_bringup
    # config_file: config/tsid_wbc.yaml       # WBC yaml (default set in WBCController::on_init)
    # left_foot_frame: left_ankle_pitch_link
    # right_foot_frame: right_ankle_pitch_link
    # imu_name: imu                           # <sensor name> in biped_hw.urdf.xacro
    # enabled_interface: BipedSystem/enabled
