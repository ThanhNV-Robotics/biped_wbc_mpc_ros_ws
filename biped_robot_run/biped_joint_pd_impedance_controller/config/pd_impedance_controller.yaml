controller_manager:
  ros__parameters:
    update_rate: 500  # Hz - match your control loop frequency

    pd_impedance_controller:
      type: biped_joint_pd_impedance_controller/PdImpedanceController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

# PD Impedance gains for MuJoCo hardware interface
# Used when position + velocity + feedforward_effort interfaces are claimed
# τ = Kp·(q_des - q) + Kd·(qd_des - qd) + τ_ff
/**:
  ros__parameters:
    pd_gains:
      kp:
        # Left leg
        left_hip_pitch_joint: 250.0
        left_hip_roll_joint: 250.0
        left_hip_yaw_joint: 150.0
        left_knee_pitch_joint: 200.0
        left_ankle_roll_joint: 50.0
        left_ankle_pitch_joint: 50.0
        # Right leg
        right_hip_pitch_joint: 250.0
        right_hip_roll_joint: 250.0
        right_hip_yaw_joint: 150.0
        right_knee_pitch_joint: 200.0
        right_ankle_roll_joint: 50.0
        right_ankle_pitch_joint: 50.0
      
      kd:
        # Left leg
        left_hip_pitch_joint: 2.5
        left_hip_roll_joint: 2.5
        left_hip_yaw_joint: 2.0
        left_knee_pitch_joint: 2.5
        left_ankle_roll_joint: 1.5
        left_ankle_pitch_joint: 1.5
        # Right leg
        right_hip_pitch_joint: 2.5
        right_hip_roll_joint: 2.5
        right_hip_yaw_joint: 2.0
        right_knee_pitch_joint: 2.5
        right_ankle_roll_joint: 1.5
        right_ankle_pitch_joint: 1.5

      # kp:
      #   # Left leg
      #   left_hip_pitch_joint: 0.0
      #   left_hip_roll_joint: 0.0
      #   left_hip_yaw_joint: 0.0
      #   left_knee_pitch_joint: 0.0
      #   left_ankle_roll_joint: 0.0
      #   left_ankle_pitch_joint: 0.0
      #   # Right leg
      #   right_hip_pitch_joint: 0.0
      #   right_hip_roll_joint: 0.0
      #   right_hip_yaw_joint: 0.0
      #   right_knee_pitch_joint: 0.0
      #   right_ankle_roll_joint: 0.0
      #   right_ankle_pitch_joint: 0.0
      
      # kd:
      #   # Left leg
      #   left_hip_pitch_joint: 0.0
      #   left_hip_roll_joint: 0.0
      #   left_hip_yaw_joint: 0.0
      #   left_knee_pitch_joint: 0.0
      #   left_ankle_roll_joint: 0.0
      #   left_ankle_pitch_joint: 0.0
      #   # Right leg
      #   right_hip_pitch_joint: 0.0
      #   right_hip_roll_joint: 0.0
      #   right_hip_yaw_joint: 0.0
      #   right_knee_pitch_joint: 0.0
      #   right_ankle_roll_joint: 0.0
      #   right_ankle_pitch_joint: 0.0
  ros__parameters:
    pid_gains:
      position:
        # Impedance Control Gains: τ = Kp*(q_target - q) + Kd*(qd_target - qd) + τ_ff
        # Kp = position stiffness, Kd = velocity damping
        
        # Left leg joints
        left_hip_pitch_joint:
          p: 0.0   # Position gain (Kp)
          i: 0.0     # Not used in impedance mode
          d: 0.0    # Velocity gain (Kd) - adds damping
        left_hip_roll_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        left_hip_yaw_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        left_knee_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0    # Higher Kd for stronger joints
        left_ankle_roll_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        left_ankle_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        # Right leg joints
        right_hip_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        right_hip_roll_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        right_hip_yaw_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        right_knee_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        right_ankle_roll_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        right_ankle_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0
      velocity:
        # Left leg joints
        left_hip_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        left_hip_roll_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        left_hip_yaw_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        left_knee_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        left_ankle_roll_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        left_ankle_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0

        # Right leg joints
        right_hip_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        right_hip_roll_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        right_hip_yaw_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        right_knee_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        right_ankle_roll_joint:
          p: 0.0
          i: 0.0
          d: 0.0
        right_ankle_pitch_joint:
          p: 0.0
          i: 0.0
          d: 0.0
# Controller configuration
pd_impedance_controller:
  ros__parameters:
    # Joint names - all actuated joints for the biped
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_pitch_joint
      - left_ankle_roll_joint
      - left_ankle_pitch_joint   
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_pitch_joint
      - right_ankle_roll_joint
      - right_ankle_pitch_joint
    
    # Command interfaces - PD impedance mode uses position, velocity, and feedforward torque
    command_interfaces:
      - position          # q_des - desired position
      - velocity          # qd_des - desired velocity
      - feedforward_effort  # tau_ff - feedforward torque
    
    # State interfaces - read joint position and velocity
    state_interfaces:
      - position
      - velocity
    
    # Verbose output
    verbose: true

joint_state_broadcaster:
  ros__parameters:
    use_global_arguments: true

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: torso_imu
    frame_id: torso_imu
