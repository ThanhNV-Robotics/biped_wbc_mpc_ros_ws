controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_position_controller:
      type: "joint_position_controllers/JointPositionController"

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      - left_hip_pitch
      - left_hip_roll
      - left_hip_yaw
      - left_knee
      - left_ankle_roll
      - left_ankle_pitch
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
