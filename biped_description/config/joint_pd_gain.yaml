/**:
  ros__parameters:
    pid_gains:
      position:
        # Impedance Control Gains: τ = Kp*(q_target - q) + Kd*(qd_target - qd) + τ_ff
        # Kp = position stiffness, Kd = velocity damping
        
        # Left leg joints
        left_hip_pitch_joint:
          p: 150.0   # Position gain (Kp)
          i: 0.0     # Not used in impedance mode
          d: 10.0    # Velocity gain (Kd) - adds damping
        left_hip_roll_joint:
          p: 150.0
          i: 0.0
          d: 10.0
        left_hip_yaw_joint:
          p: 150.0
          i: 0.0
          d: 10.0
        left_knee_pitch_joint:
          p: 350.0
          i: 0.0
          d: 20.0    # Higher Kd for stronger joints
        left_ankle_roll_joint:
          p: 60.0
          i: 0.0
          d: 5.0
        left_ankle_pitch_joint:
          p: 60.0
          i: 0.0
          d: 5.0
        # Right leg joints
        right_hip_pitch_joint:
          p: 350.0
          i: 0.0
          d: 20.0
        right_hip_roll_joint:
          p: 300.0
          i: 0.0
          d: 18.0
        right_hip_yaw_joint:
          p: 100.0
          i: 0.0
          d: 8.0
        right_knee_pitch_joint:
          p: 350.0
          i: 0.0
          d: 20.0
        right_ankle_roll_joint:
          p: 60.0
          i: 0.0
          d: 5.0
        right_ankle_pitch_joint:
          p: 60.0
          i: 0.0
          d: 5.0
      velocity:
        # Left leg joints
        left_hip_pitch_joint:
          p: 150.0
          i: 0.0
          d: 0.0
        left_hip_roll_joint:
          p: 1.5
          i: 0.0
          d: 0.0
        left_hip_yaw_joint:
          p: 2.0
          i: 0.0
          d: 0.0
        left_knee_pitch_joint:
          p: 2.5
          i: 0.0
          d: 0.0
        left_ankle_roll_joint:
          p: 1.5
          i: 0.0
          d: 0.0
        left_ankle_pitch_joint:
          p: 1.5
          i: 0.0
          d: 0.0

        # Right leg joints
        right_hip_pitch_joint:
          p: 150.0
          i: 0.0
          d: 0.0
        right_hip_roll_joint:
          p: 1.5
          i: 0.0
          d: 0.0
        right_hip_yaw_joint:
          p: 2.0
          i: 0.0
          d: 0.0
        right_knee_pitch_joint:
          p: 2.5
          i: 0.0
          d: 0.0
        right_ankle_roll_joint:
          p: 2.5
          i: 0.0
          d: 0.0
        right_ankle_pitch_joint:
          p: 2.5
          i: 0.0
          d: 0.0
