# kp / kd for the MuJoCo simulation (launch/sim.launch.py, default `gains`). Same format and law as
# joint_gains.yaml (the robot), applied by the simulated drives every physics step:
#
#   tau = kp * (pos_target - q) + kd * (vel_target - dq) + tau_ff   [Nm, rad, rad/s]
#
# Differences to the robot:
#   - The sim ankle is a serial roll / pitch chain: the ankle kp / kd act on the joints directly
#     (on the robot they are motor-space gains of the two ankle motors).
#   - The MJCF links are light: with the 1 ms explicit step, kd * 0.001 / (joint inertia) must stay
#     well below 2 or the joint chatters. Ankle roll is the critical one (armature 0.00088 kg m^2,
#     40 g link): kd 3 already chatters there, keep ankle kd <= ~1.
#
# Checked in the hanging scene: kp 100 / kd 0.5 holds every joint within 0.005 rad.
# kp must be in [0, 1000], kd in [0, 50] (checked in on_init).

left_hip_pitch_joint:    {kp: 100.0, kd: 2.0}
left_hip_roll_joint:     {kp: 100.0, kd: 2.0}
left_hip_yaw_joint:      {kp: 50.0,  kd: 1.0}
left_knee_pitch_joint:   {kp: 100.0, kd: 2.0}
left_ankle_roll_joint:   {kp: 20.0,  kd: 0.3}
left_ankle_pitch_joint:  {kp: 20.0,  kd: 0.3}

right_hip_pitch_joint:   {kp: 100.0, kd: 2.0}
right_hip_roll_joint:    {kp: 100.0, kd: 2.0}
right_hip_yaw_joint:     {kp: 50.0,  kd: 1.0}
right_knee_pitch_joint:  {kp: 100.0, kd: 2.0}
right_ankle_roll_joint:  {kp: 20.0,  kd: 0.3}
right_ankle_pitch_joint: {kp: 20.0,  kd: 0.3}
