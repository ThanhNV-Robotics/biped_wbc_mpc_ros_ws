# Full path required so this section is loaded by the namespaced controller_manager.
# use_sim_time is intentionally absent here — it is set by the launch file so that
# mujoco_sim.launch uses True (needs /clock from MuJoCo) and real_hw.launch uses False
# (steady clock).  If use_sim_time:true landed here and no /clock topic is published,
# the CM's trigger clock (rclcpp::Clock::sleep_until) would block forever and
# switch_controller would always time out.
/legged_hw/controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

# Explicit names for controllers loaded inside the legged_hw namespace.
# Jazzy controller_manager creates controller nodes under its own namespace,
# so joint_state_broadcaster lives at /legged_hw/joint_state_broadcaster.
/legged_hw/joint_state_broadcaster:
  ros__parameters:
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_pitch_joint
      - left_ankle_roll_joint
      - left_ankle_pitch_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_pitch_joint
      - right_ankle_roll_joint
      - right_ankle_pitch_joint

/legged_hw/imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: torso_imu
    frame_id: link0_torso

# Wildcard fallback — covers the case where the spawner creates controller
# nodes without a namespace prefix (depends on Jazzy ros2_control version).
/**:
  ros__parameters:
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_pitch_joint
      - left_ankle_roll_joint
      - left_ankle_pitch_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_pitch_joint
      - right_ankle_roll_joint
      - right_ankle_pitch_joint
    sensor_name: torso_imu
    frame_id: link0_torso
